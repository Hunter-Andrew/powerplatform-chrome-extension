<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Power Apps Form Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <h1>Form Inspector</h1>
    <span id="status" class="status">…</span>
  </header>

  <div id="envbar" class="envbar" hidden>
    <span class="envdot"></span>
    <span id="env-host" class="envhost"></span>
    <select id="env-tag" title="How the production guardrail treats this environment">
      <option value="">Auto</option>
      <option value="prod">Production</option>
      <option value="test">Test</option>
      <option value="dev">Development</option>
    </select>
  </div>

  <div id="notice" class="notice" hidden></div>

  <div id="guard" class="guard" hidden>
    <b>This looks like a production environment</b>
    <p id="guard-text"></p>
    <div class="actions">
      <button id="guard-go" class="danger">Turn on anyway</button>
      <button id="guard-cancel">Cancel</button>
    </div>
  </div>

  <main id="main">
    <section>
      <h2>Inspect</h2>
      <button id="picker" class="primary big" data-needs-form>
        <span class="ico">⌖</span>
        <span><b>Pick element</b><small>Click a field, section or tab to get its logical name</small></span>
        <kbd data-shortcut="toggle-picker"></kbd>
      </button>
      <div class="row">
        <label class="toggle" data-needs-form>
          <input type="checkbox" id="labels">
          <span class="sw"></span>
          <span>Show logical names <small>badges on every tab, section & field</small></span>
          <kbd data-shortcut="toggle-labels"></kbd>
        </label>
      </div>
      <button id="panel" class="big" data-needs-form>
        <span class="ico">☰</span>
        <span><b>All fields</b><small>Searchable list of attributes, values & types</small></span>
      </button>
    </section>

    <section>
      <h2>Developer tools</h2>
      <div class="tiles">
        <button class="tile" data-dev="events" data-needs-form><b>Events &amp; scripts</b><small>Form handlers + live monitor</small></button>
        <button class="tile" data-dev="logic" data-needs-form><b>Business rules</b><small>Rules &amp; calculated columns</small></button>
        <button class="tile" data-dev="options" data-needs-form><b>Option sets</b><small>Values &amp; integer codes</small></button>
        <button class="tile" data-dev="lookups" data-needs-form><b>Lookups</b><small>GUIDs &amp; Web API filters</small></button>
        <button class="tile" data-dev="process" data-needs-form><b>Process flow</b><small>BPF stages, steps &amp; GUIDs</small></button>
      </div>
    </section>

    <section>
      <h2>Form overrides <small>(client-side only, until you toggle off or navigate away)</small></h2>
      <label class="toggle" data-needs-form>
        <input type="checkbox" id="reveal">
        <span class="sw"></span>
        <span>Reveal hidden <small id="reveal-count">tabs, sections & fields</small></span>
        <kbd data-shortcut="toggle-reveal"></kbd>
      </label>
      <label class="toggle" data-needs-form>
        <input type="checkbox" id="unlock">
        <span class="sw"></span>
        <span>Unlock read-only fields <small id="unlock-count">enable disabled controls</small></span>
      </label>
      <label class="toggle" data-needs-form>
        <input type="checkbox" id="optional">
        <span class="sw"></span>
        <span>Make all fields optional <small id="optional-count">clear required levels</small></span>
      </label>
    </section>

    <section id="record-section" hidden>
      <h2>Record</h2>
      <dl id="record"></dl>
      <div class="actions">
        <button id="copy-url">Copy record URL</button>
        <button id="open-api">Open in Web API</button>
      </div>
    </section>

    <section id="env-section" hidden>
      <h2>Environment</h2>
      <dl id="env"></dl>
    </section>
  </main>

  <footer>
    <a href="#" id="shortcuts">Change keyboard shortcuts</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
